# cargo-nextest configuration (spec §4.1.3, §4.10.5; owner R0). nextest is the normative
# test runner: process-per-test isolates the process-global state (runtime flags, the
# environment, a loaded PKCS#11 module) that plain `cargo test` threads would share.

[test-groups]
# Every SoftHSM test shares the one fixture token initialized by scripts/softhsm-init.sh:
# run them one at a time (spec §4.10.5; may be relaxed once verified).
softhsm = { max-threads = 1 }

[profile.default]
# A hung PKCS#11 call or a prompt waiting for input shows up as SLOW, then fails.
slow-timeout = { period = "60s", terminate-after = 5 }

[[profile.default.overrides]]
filter = "test(/softhsm/) | binary(/softhsm/)"
test-group = "softhsm"

[profile.ci]
fail-fast = false
failure-output = "immediate-final"
