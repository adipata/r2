[package]
name = "r2-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
softhsm = []
# spec §9 (owner R12): openssl-src 300.x, `no-shared no-module`, `legacy` compiled in, with
# OpenSSL's default camellia/idea/seed ciphers (the build-dependency below unifies with
# openssl-sys's own openssl-src build-dependency).
vendored-openssl = ["openssl/vendored", "dep:openssl-src"]

[dependencies]
openssl = { workspace = true }
der = { workspace = true }
spki = { workspace = true }
x509-cert = { workspace = true }
const-oid = { workspace = true }
secrecy = { workspace = true }
zeroize = { workspace = true }
indexmap = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
comfy-table = { workspace = true }
anstyle = { workspace = true }
tracing = { workspace = true }

# spec §9 (owner R12): only for the features above; r2-core has no build script.
[build-dependencies]
openssl-src = { workspace = true, optional = true }

[dev-dependencies]
r2-testkit = { workspace = true }
tempfile = { workspace = true }
