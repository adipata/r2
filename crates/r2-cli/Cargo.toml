[package]
name = "r2-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "r2"
path = "src/main.rs"

[lints]
workspace = true

[features]
softhsm = ["r2-testkit/softhsm"]
# spec §9 (owner R12): release builds statically link a vendored OpenSSL 3 (legacy provider
# compiled in): r2-cli/vendored-openssl → r2-core/vendored-openssl → openssl/vendored.
vendored-openssl = ["r2-core/vendored-openssl"]

[dependencies]
r2-console = { workspace = true }
r2-memory = { workspace = true }
r2-pkcs11 = { workspace = true }
r2-ops = { workspace = true }
r2-provider = { workspace = true }
r2-config = { workspace = true }
r2-core = { workspace = true }
clap = { workspace = true }
ctrlc = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
regex = { workspace = true }

[dev-dependencies]
r2-testkit = { workspace = true }
assert_cmd = { workspace = true }
tempfile = { workspace = true }
