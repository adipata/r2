# cargo-deny configuration (spec §9 "Supply chain"; R0). Run: `cargo deny check`.
# Checks advisories, bans (exactly one `der` version in the tree) and licenses compatible
# with GPL-3.0 (r2 keeps c2's license).

[graph]
# Every target r2 ships or tests on (spec §9 release targets + CI matrix), so a
# platform-only dependency (windows-sys, security-framework, …) is checked too.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.93
# The allow list is forward-looking; entries no current dependency uses are not warnings.
unused-allowed-license = "allow"
# Permissive licenses that are compatible with GPL-3.0 (plus r2's own license).
allow = [
    "GPL-3.0-only",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "Unicode-3.0",
    "Unlicense",
    "CC0-1.0",
    "MPL-2.0",
]

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "lowest-version"
deny = [
    # spec §9: exactly one `der` version in the tree (der/spki/x509-cert/const-oid pins).
    { crate = "der", deny-multiple-versions = true, reason = "spec §9: a single der version" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
